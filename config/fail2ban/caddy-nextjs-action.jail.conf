# Fail2Ban jail: block scanners probing Next.js Server Actions.
#
# Installed to /etc/fail2ban/jail.d/caddy-nextjs-action.conf by
# `scripts/install.sh`. Filter: caddy-nextjs-action.filter.conf.
#
# The ban is scoped to http/https only — SSH can never be locked out by this
# jail, whatever the filter matches.
[caddy-nextjs-action]
enabled  = true
filter   = caddy-nextjs-action

# REQUIRED. Debian/Ubuntu ship /etc/fail2ban/jail.d/defaults-debian.conf which
# sets `backend = systemd` in [DEFAULT]. Without this override the jail reads
# the systemd journal instead of Caddy's log file and silently never matches —
# `fail2ban-client status` shows "Journal matches" where it should list "File".
backend  = auto

logpath  = /var/log/caddy/access.log
port     = http,https
maxretry = 5
findtime = 600
bantime  = 3600
