# Fail2Ban filter: Next.js Server Action probing, seen in Caddy's JSON access log.
#
# Installed to /etc/fail2ban/filter.d/caddy-nextjs-action.conf by
# `scripts/install.sh`. Pairs with caddy-nextjs-action.jail.conf.
#
# WHAT IT CATCHES
#   Scanners hammer the site with a `Next-Action` header carrying junk ids
#   ("x", "y", "1", "test"). A genuine Server Action id is a long hex hash
#   (40+ chars) — that is what a real client sends, including a client whose
#   page is left over from a previous deploy. So we match on SHORT / NON-HEX
#   ids via a negative lookahead: false positives on live users are ~zero.
#
#   The response status is deliberately NOT part of the pattern: probes arrive
#   as both GET and POST and draw 307/404/405 depending on the route.
#
# TWO GOTCHAS (both cost real debugging time — do not "simplify" them away)
#   1. Do NOT anchor the regex at start-of-line or on the "ts" field.
#      Fail2ban strips the matched timestamp from the line BEFORE applying
#      failregex, so an anchored pattern silently matches nothing (0 hits on a
#      log where the datepattern itself matched 29k times).
#   2. `datepattern` must be the epoch form below — Caddy logs `"ts":<epoch>`.
[Definition]
failregex = "client_ip":"<HOST>",.*?"Next-Action":\["(?![0-9a-fA-F]{40,}")[^"]*"\]
ignoreregex =
datepattern = "ts":{EPOCH}
